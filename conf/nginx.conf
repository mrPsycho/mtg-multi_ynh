# NGINX config for mtg-multi web interface
# Provides per-user proxy configuration via YunoHost SSO
# Supports both subdomain (mtg-multi.domain.tld) and path (domain.tld/mtg-multi) installation

location __PATH__ {

    alias __INSTALL_DIR__/www/;
    index index.php;

    # PHP-FPM for dynamic content
    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass unix:/var/run/php/php__PHP_VERSION__-fpm-__NAME__.sock;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $request_filename;
        fastcgi_param PATH_INFO $path_info;
        fastcgi_param PHP_VALUE "upload_max_filesize = 10M \n post_max_size = 10M";
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
    }

    # Deny access to config files
    location ~ (mtg\.toml|\.md|LICENSE)$ {
        deny all;
    }

    # API proxy to mtg-multi stats endpoint
    location __PATH__/api/ {
        proxy_pass http://127.0.0.1:9090/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}