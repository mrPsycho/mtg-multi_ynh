# MTG-Multi Nginx configuration for YunoHost
#
# This config serves the informational status page at the app's URL.
# The proxy itself runs independently on its own port.

location __PATH__/ {
    alias __INSTALL_DIR__/;

    # Serve the status page (static HTML with JS)
    index index.php;
    try_files $uri $uri/ __PATH__/index.php?$args;
}

# Deny access to configuration files
location ~ __PATH__/\. {
    deny all;
    access_log off;
    log_not_found off;
}

location ~ __PATH__/mtg\.toml {
    deny all;
    access_log off;
    log_not_found off;
}