# MTG-Multi Nginx configuration for YunoHost
#
# This config serves the per-user status page at the app's URL.
# The proxy itself runs independently on its own port.

#sub_path_only location = __PATH__ {
#sub_path_only     return 301 __PATH__/;
#sub_path_only }

location __PATH__/ {

  # Drop any client-supplied identity header before the SSO sets the real one
  # (headers-more runs in the rewrite phase, SSOwat's lua in the access phase).
  more_clear_input_headers "Ynh-User";
  more_clear_input_headers "Authorization";

  # Single-page app: every request is handled by index.php, so nginx needs no
  # read access to __INSTALL_DIR__ and can never serve secrets.toml / mtg.toml.
  # SCRIPT_FILENAME is set after the include, which otherwise derives it from
  # the request path.
  include fastcgi_params_with_auth;
  fastcgi_param SCRIPT_FILENAME __INSTALL_DIR__/www/index.php;
  fastcgi_pass unix:/var/run/php/php__PHP_VERSION__-fpm-__APP__.sock;
}