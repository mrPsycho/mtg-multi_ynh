# MTG-Multi Nginx configuration for YunoHost
#
# This config serves the informational status page at the app's URL.
# The proxy itself runs independently on its own port.

location __PATH__/ {
    alias __INSTALL_DIR__/;

    # Serve the status page
    index index.php;
    try_files $uri $uri/ __PATH__/index.php?$args;
}

location ~ ^__PATH__/.+\.php$ {
    alias __INSTALL_DIR__/;
    fastcgi_split_path_info ^(.+\.php)(/.+)$;
    fastcgi_pass unix:/var/run/php/php-fpm.sock;
    fastcgi_index index.php;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $request_filename;
    fastcgi_param PATH_INFO $fastcgi_path_info;
    fastcgi_param YNH_DOMAIN $host;
}

# Deny access to configuration files
location ~ __PATH__/\. {
    deny all;
    access_log off;
    log_not_found off;
}

location ~ __PATH__/mtg\.toml {
    deny all;
    access_log off;
    log_not_found off;
}