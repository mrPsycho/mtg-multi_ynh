#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2
id = "mtg-multi"
name = "mtg-multi"
description.en = "Fork of mtg with multi-secret support and per-user stats"
description.fr = "Fork de mtg avec support multi-secret et statistiques par utilisateur"

version = "1.11.0~ynh4"

maintainers = ["mrpsycho"]

[upstream]
license = "MIT"
code = "https://github.com/dolonet/mtg-multi"
admindoc = "https://github.com/dolonet/mtg-multi/blob/master/README.md"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = ["amd64", "arm64"]
multi_instance = false

# Users don't log in *into* mtg with their YunoHost credentials...
ldap = false
# ...but the personal page showing their own secret is behind the YunoHost SSO.
sso = true

ram.build = "50M"
ram.runtime = "50M"
disk = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/mtg-multi"

    [install.init_main_permission]
    type = "group"
    default = "all_users"

    [install.port]
    type = "number"
    ask.en = "Choose a port for the proxy to bind to"
    ask.fr = "Choisissez un port auquel le proxy doit se connecter"
    default = 3128

    [install.dns]
    type = "string"
    ask.en = "Enter the DNS resolver IP"
    ask.fr = "Saisissez l'adresse IP du résolveur DNS"
    default = "1.1.1.1"

    [install.frontend_domain]
    type = "string"
    ask.en = "Domain to use for domain fronting, used to generate every user's secret"
    ask.fr = "Domaine à utiliser pour le domain fronting, utilisé pour générer le secret de chaque utilisateur"
    default = "storage.googleapis.com"

    [install.prometheus]
    type = "boolean"
    ask.en = "Enable Prometheus metrics?"
    ask.fr = "Activer les métriques Prometheus ?"
    default = false

[resources]
    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
        [resources.permissions.main]
        url = "/"

    [resources.apt]
    packages = "php8.2-fpm"

    [resources.ports]
        # The proxy port must be reachable from the internet (MTProto is TCP-only)
        [resources.ports.main]
        default = 3128
        exposed = "TCP"

        # Stats API and Prometheus exporter stay on loopback
        [resources.ports.api]
        default = 9090

        [resources.ports.prometheus]
        default = 3129

    [resources.sources.main]
    # x86_64 / amd64
    amd64.url = "https://github.com/dolonet/mtg-multi/releases/download/v1.11.0/mtg-multi-1.11.0-linux-amd64.tar.gz"
    amd64.sha256 = "aa6d9f402b9e395e7782027f9a522ac0f3e1f85c46f444843174b27a210dab35"
    # arm64 / aarch64
    arm64.url = "https://github.com/dolonet/mtg-multi/releases/download/v1.11.0/mtg-multi-1.11.0-linux-arm64.tar.gz"
    arm64.sha256 = "87e9c5d293cdb0c1dbc988690bab99bc3f16526c7196e812d33354bbfd9a6002"
