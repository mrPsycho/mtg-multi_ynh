#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2
id = "mtg-multi"
name = "mtg-multi"
description.en = "Fork of mtg with multi-secret support and per-user stats"
description.fr = "Fork de mtg avec support multi-secret et statistiques par utilisateur"

version = "1.11.0~ynh2"

maintainers = ["mrpsycho"]

[upstream]
license = "MIT"
code = "https://github.com/dolonet/mtg-multi"
admindoc = "https://github.com/dolonet/mtg-multi/blob/master/README.md"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = "all"
multi_instance = false
type = "path"

ldap = "not_relevant"
sso = "relevant"

ram.build = "50M"
ram.runtime = "50M"
disk = "50M"

[install]
    [install.port]
    type = "string"
    ask.en = "Choose a port for the proxy to bind to"
    ask.fr = "Choisissez un port auquel le proxy doit se connecter"
    default = "3128"

    [install.dns]
    type = "string"
    ask.en = "Enter the DNS resolver IP"
    ask.fr = "Saisissez l'adresse IP du résolveur DNS"
    default = "1.1.1.1"

    [install.prometheus]
    type = "boolean"
    ask.en = "Enable Prometheus metrics?"
    ask.fr = "Activer les métriques Prometheus ?"
    default = false

[resources]
    [resources.system_user]

    [resources.install_dir]

    [resources.sources.main]
    # x86_64 / amd64
    amd64.url = "https://github.com/dolonet/mtg-multi/releases/download/v1.11.0/mtg-multi-1.11.0-linux-amd64.tar.gz"
    amd64.sha256 = "aa6d9f402b9e395e7782027f9a522ac0f3e1f85c46f444843174b27a210dab35"
    # arm64 / aarch64
    arm64.url = "https://github.com/dolonet/mtg-multi/releases/download/v1.11.0/mtg-multi-1.11.0-linux-arm64.tar.gz"
    arm64.sha256 = "87e9c5d293cdb0c1dbc988690bab99bc3f16526c7196e812d33354bbfd9a6002"

    [resources.nginx]

    [resources.php_pools]
